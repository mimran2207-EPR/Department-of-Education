<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טופס נשלח בהצלחה | רישום לגני ילדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>

<main class="page">
<div class="page__split">

  <section class="form-panel">
    <div class="success-block">
      <div class="success-block__inner">
        <span class="success-block__year">שנת הלימודים תשפ"ה</span>
        <h1 class="success-block__title">
          טופס רישום לגן עבור <em id="kid-first">ניתאי</em><br>
          נשלח <strong>בהצלחה !</strong>
        </h1>
        <script>
          (function(){
            var saved = sessionStorage.getItem('currentKid');
            if(!saved) return;
            try {
              var k = JSON.parse(saved);
              var el = document.getElementById('kid-first');
              if(el && k.first) el.textContent = k.first;
            } catch(e){}
          })();
        </script>
        <div style="display:flex;justify-content:center;width:100%">
          <a href="../index.html" class="btn btn--primary">חזרה לפורטל חינוך</a>
        </div>
      </div>
    </div>
  </section>

  <aside class="illustration" style="background-image: url('../assets/img/illustrations/10-success.png')" aria-hidden="true">
    <div class="illustration__logo">
      <div class="illustration__logo-mark">M</div>
      <div class="illustration__logo-text">
        <span class="illustration__logo-name">muni</span>
        <span class="illustration__logo-tagline">הבית הדיגיטלי שלך</span>
      </div>
    </div>
  </aside>

</div>
</main>

</body>
</html>
