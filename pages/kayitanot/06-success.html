<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרישום נשלח | רישום לקייטנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/kayitanot.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="kt-i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M3 11.5 12 4l9 7.5V21h-6v-6h-6v6H3z"/></symbol>
  <symbol id="kt-i-plus" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></symbol>
</svg>

<main class="kt-page">
<div class="kt-split">

  <section class="kt-form-panel" style="justify-content:center">
    <div class="kt-form-inner kt-success">
      <h1 class="kt-success__title">הרישום נשלח בהצלחה!</h1>
      <p class="kt-success__sub">
        בקשת ההרשמה ל<b id="kt-s-camp">קייטנת קיץ</b> עבור <b id="kt-s-name">ניתאי</b> נקלטה במערכת.<br>
        תקבלו אישור סופי לדוא"ל תוך 3 ימי עסקים, ולאחר השלמת התשלום ההרשמה תהיה סופית.
      </p>
      <div class="kt-success__ref">מספר אסמכתא: <span id="kt-ref">KT-2025-072891</span></div>
      <div class="kt-success__actions">
        <a href="../../index.html" class="kt-btn kt-btn--primary">
          <svg width="18" height="18"><use href="#kt-i-home"/></svg>
          חזרה לפורטל חינוך
        </a>
        <a href="07-additional.html" class="kt-btn kt-btn--outline">
          <svg width="18" height="18"><use href="#kt-i-plus"/></svg>
          רישום ילד/ה נוסף
        </a>
      </div>
    </div>
  </section>

  <aside class="kt-illustration" aria-hidden="true">
    <div class="kt-illustration__logo">
      <img src="../../assets/img/illustrations/muni-logo.svg" alt="muni">
    </div>
    <div class="kt-illustration__art" id="kt-art"></div>
  </aside>

</div>
</main>

<script src="../../assets/js/kayitanot-illustration.js"></script>
<script>
  if (window.renderKayitanotArt) renderKayitanotArt(document.getElementById('kt-art'), 'success');

  try {
    var kid = JSON.parse(sessionStorage.getItem('ktKid') || 'null');
    if (kid) document.getElementById('kt-s-name').textContent = kid.name.split(' ')[0];
    var camp = JSON.parse(sessionStorage.getItem('ktCamp') || 'null');
    if (camp) document.getElementById('kt-s-camp').textContent = camp.name;
  } catch(_){}

  // Random reference number
  var ref = 'KT-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random()*900000+100000));
  document.getElementById('kt-ref').textContent = ref;
</script>
</body>
</html>
