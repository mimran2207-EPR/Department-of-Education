<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בחירת קייטנה | רישום לקייטנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/kayitanot.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="kt-i-search" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9"/></symbol>
  <symbol id="kt-i-cal" viewBox="0 0 24 24"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14z"/></symbol>
  <symbol id="kt-i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></symbol>
  <symbol id="kt-i-clock" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm.5 11H7v-2h3.5V6h2v7z"/></symbol>
  <symbol id="kt-i-house" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></symbol>
  <symbol id="kt-i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></symbol>
  <symbol id="kt-i-arr-l" viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
  <symbol id="kt-i-send" viewBox="0 0 24 24"><path fill="currentColor" d="M3 20v-6l8-2-8-2V4l19 8z"/></symbol>
  <symbol id="kt-i-soccer" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-1-12 3 2-1 4-3-1z"/></symbol>
  <symbol id="kt-i-tree" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 6 12h3l-3 6h12l-3-6h3z"/></symbol>
  <symbol id="kt-i-palette" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2 2 2 0 0 0-.5-1.3 1 1 0 0 1 .8-1.7H16a6 6 0 0 0 6-6c0-5.5-4.5-9-10-9zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0-6a2 2 0 1 1 4 0 2 2 0 0 1-4 0zm6-2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm6 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></symbol>
  <symbol id="kt-i-wave" viewBox="0 0 24 24"><path fill="currentColor" d="M3 13c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0v3c-2 1.5-4 1.5-6 0s-4-1.5-6 0-4 1.5-6 0z"/></symbol>
  <symbol id="kt-i-robot" viewBox="0 0 24 24"><path fill="currentColor" d="M20 9V7a2 2 0 0 0-2-2h-3V3h-2v2H9V3H7v2H6a2 2 0 0 0-2 2v2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2zM9 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm6 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm.5 4h-7v-2h7z"/></symbol>
  <symbol id="kt-i-compass" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm2.83 11.83L8 16l2.17-6.83L17 8z"/></symbol>
</svg>

<div class="kt-wide">

  <header class="kt-wide__top">
    <a href="../../index.html" style="display:inline-flex; align-items:center; gap:10px; text-decoration:none">
      <img src="../../assets/img/illustrations/muni-logo.svg" alt="muni" style="height:48px">
    </a>
    <h1 class="kt-wide__top-title">בחרו קייטנה לניתאי</h1>
    <span class="kt-wide__top-tag">שנת הלימודים תשפ"ה</span>
  </header>

  <div class="kt-camp-layout">

    <div class="kt-map-panel">
      <div class="kt-map" id="kt-map"></div>
    </div>

    <div class="kt-list-panel">

      <div class="kt-filters">
        <div class="kt-search">
          <svg width="18" height="18"><use href="#kt-i-search"/></svg>
          <input id="kt-q" placeholder="חיפוש">
        </div>
        <button type="button" class="kt-chip kt-chip--active" data-filter="all">
          <svg><use href="#kt-i-compass"/></svg>
          הכל
        </button>
        <button type="button" class="kt-chip" data-filter="nature">
          <svg><use href="#kt-i-tree"/></svg>
          טבע
        </button>
        <button type="button" class="kt-chip" data-filter="sea">
          <svg><use href="#kt-i-wave"/></svg>
          גלישה / ים
        </button>
        <button type="button" class="kt-chip" data-filter="art">
          <svg><use href="#kt-i-palette"/></svg>
          אמנות
        </button>
        <button type="button" class="kt-chip" data-filter="robot">
          <svg><use href="#kt-i-robot"/></svg>
          רובוטיקה
        </button>
        <button type="button" class="kt-chip" data-filter="sport">
          <svg><use href="#kt-i-soccer"/></svg>
          ספורט
        </button>
      </div>

      <div class="kt-list-count" id="kt-camp-count">סה"כ 12 קייטנות</div>

      <div id="kt-camp-list" style="display:flex; flex-direction:column; gap:14px;"></div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  // Real camp photos by category — Figma photos for sea/robot, Unsplash CDN for others
  var IMG = {
    'sea-1':    '../../assets/img/kayitanot/camps/sea-1.jpg',
    'sea-2':    '../../assets/img/kayitanot/camps/sea-2.jpg',
    'robot-1':  '../../assets/img/kayitanot/camps/robot-1.jpg',
    'robot-2':  '../../assets/img/kayitanot/camps/robot-2.jpg',
    'nature-1': 'https://images.unsplash.com/photo-1551632811-561732d1e306?w=600&h=500&fit=crop',
    'nature-2': 'https://images.unsplash.com/photo-1438565434616-3ef039228b15?w=600&h=500&fit=crop',
    'sport-1':  'https://images.unsplash.com/photo-1517649763962-0c623066013b?w=600&h=500&fit=crop',
    'sport-2':  'https://images.unsplash.com/photo-1547036967-23d11aacaee0?w=600&h=500&fit=crop',
    'art-1':    'https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=600&h=500&fit=crop',
    'art-2':    'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&h=500&fit=crop',
    'art-3':    'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&h=500&fit=crop'
  };

  // Demo camps
  var CAMPS = [
    { id:'c1',  name:'קייטנת גלישה "גלים"',        addr:'מועדון גלישה אקסטרים, הרוכב 83 הרצליה', dates:'1-21 ביולי',     days:'א\' - ה\'',  hours:'08:00 - 13:00', ages:'8-16',  price:1500, badge:'rec',  badgeLabel:'מומלץ',          tags:['גלישה','ים','ספורט'],          cat:'sea',    img:IMG['sea-1'],    lat:32.166, lng:34.842 },
    { id:'c2',  name:'קייטנת קיץ טכנולוגי',         addr:'סבידור 14, תל אביב',                  dates:'15-28 באוגוסט',  days:'א\' - ה\'',  hours:'08:00 - 15:00', ages:'10-14', price:3200, badge:'new',  badgeLabel:'חדש',           tags:['תכנות','רובוטיקה'],          cat:'robot',  img:IMG['robot-2'],  lat:32.0853, lng:34.7818 },
    { id:'c3',  name:'קייטנת גלישה אקסטרים',        addr:'מועדון גלישה אקסטרים, הרוכב 83 הרצליה', dates:'1-21 ביולי',     days:'א\' - ו\'',  hours:'08:00 - 13:00', ages:'8-16',  price:1500, badge:'last', badgeLabel:'מקומות אחרונים', tags:['גלישה','ים','ספורט'],         cat:'sea',    img:IMG['sea-2'],    lat:32.172, lng:34.835 },
    { id:'c4',  name:'קייטנת אומנויות יצירתי',      addr:'אבן גבירול 35, תל אביב',              dates:'15-28 ביולי',    days:'א\' - ה\'',  hours:'08:00 - 14:00', ages:'7-12',  price:1800, badge:'rec',  badgeLabel:'מומלץ',          tags:['ציור','קולנוע','פיסול'],         cat:'art',    img:IMG['art-1'],    lat:32.0780, lng:34.7820 },
    { id:'c5',  name:'קייטנת טבע ומדע',            addr:'דיזנגוף 200, תל אביב',                dates:'1-14 ביולי',     days:'א\' - ה\'',  hours:'08:00 - 16:00', ages:'9-13',  price:2100, badge:'',     badgeLabel:'',               tags:['מדע','טבע','טיולים'],            cat:'nature', img:IMG['nature-1'], lat:32.0820, lng:34.7780 },
    { id:'c6',  name:'קייטנת כדורגל מקצוענים',     addr:'יד אליהו 5, תל אביב',                 dates:'15-28 ביולי',    days:'א\' - ו\'',  hours:'08:00 - 14:00', ages:'8-14',  price:1900, badge:'rec',  badgeLabel:'מומלץ',          tags:['כדורגל','ספורט'],               cat:'sport',  img:IMG['sport-1'],  lat:32.0700, lng:34.7850 },
    { id:'c7',  name:'קייטנת רובוטיקה אדוונסד',    addr:'אילון 12, תל אביב',                   dates:'1-14 באוגוסט',   days:'א\' - ה\'',  hours:'08:00 - 15:00', ages:'10-14', price:2800, badge:'new',  badgeLabel:'חדש',           tags:['רובוטיקה','קוד','AI'],          cat:'robot',  img:IMG['robot-1'],  lat:32.0890, lng:34.7780 },
    { id:'c8',  name:'קייטנת שחייה מקצועית',       addr:'גלילי 8, תל אביב',                    dates:'15-28 ביולי',    days:'א\' - ה\'',  hours:'09:00 - 14:00', ages:'6-10',  price:1400, badge:'',     badgeLabel:'',               tags:['שחייה','בריכה'],                cat:'sea',    img:IMG['sea-1'],    lat:32.0750, lng:34.7800 },
    { id:'c9',  name:'קייטנת בישול ואפייה',         addr:'יהודה הלוי 40, תל אביב',              dates:'1-14 ביולי',     days:'א\' - ה\'',  hours:'09:00 - 14:00', ages:'8-12',  price:1700, badge:'rec',  badgeLabel:'מומלץ',          tags:['בישול','אפייה','קולינריה'],     cat:'art',    img:IMG['art-2'],    lat:32.0640, lng:34.7770 },
    { id:'c10', name:'קייטנת טיולים בטבע',         addr:'נמיר 150, תל אביב',                   dates:'15-28 באוגוסט',  days:'א\' - ה\'',  hours:'08:00 - 17:00', ages:'11-14', price:2300, badge:'',     badgeLabel:'',               tags:['טבע','טיולים','אקסטרים'],       cat:'nature', img:IMG['nature-2'], lat:32.0950, lng:34.7950 },
    { id:'c11', name:'קייטנת מוזיקה והופעה',       addr:'ארלוזורוב 25, תל אביב',               dates:'1-14 ביולי',     days:'א\' - ה\'',  hours:'09:00 - 14:00', ages:'7-13',  price:1600, badge:'new',  badgeLabel:'חדש',           tags:['מוזיקה','הופעה','שירה'],        cat:'art',    img:IMG['art-3'],    lat:32.0770, lng:34.7770 },
    { id:'c12', name:'קייטנת ויזיון אקסטרים',      addr:'יפת 22, תל אביב',                     dates:'15-28 ביולי',    days:'א\' - ו\'',  hours:'08:00 - 16:00', ages:'10-14', price:2500, badge:'last', badgeLabel:'מקומות אחרונים', tags:['אקסטרים','טיפוס'],              cat:'sport',  img:IMG['sport-2'],  lat:32.0540, lng:34.7600 }
  ];

  var list = document.getElementById('kt-camp-list');
  var counter = document.getElementById('kt-camp-count');
  var currentFilter = 'all';

  function renderList() {
    var q = (document.getElementById('kt-q').value || '').trim();
    var arr = CAMPS.filter(function(c){
      if (q && c.name.indexOf(q) === -1 && c.addr.indexOf(q) === -1) return false;
      if (currentFilter !== 'all' && c.cat !== currentFilter) return false;
      return true;
    });
    counter.textContent = 'סה"כ ' + arr.length + ' קייטנות';
    list.innerHTML = arr.map(function(c){
      var badgeHtml = c.badge
        ? '<span class="kt-camp-card__badge kt-camp-card__badge--'+c.badge+'">'+c.badgeLabel+'</span>'
        : '';
      var href = '04-camp-page.html?camp='+c.id;
      return ''+
        '<a class="kt-camp-card" href="'+href+'" data-id="'+c.id+'">'+
        '  <div class="kt-camp-card__side">'+
        '    <div>'+
        '      <div class="kt-camp-card__price-l">מחיר למשתתף</div>'+
        '      <div class="kt-camp-card__price">₪'+c.price.toLocaleString('he-IL')+'</div>'+
        '    </div>'+
        '    <span class="kt-camp-card__cta">'+
        '      <svg><use href="#kt-i-arr-l"/></svg>'+
        '      לפרטים והרשמה'+
        '    </span>'+
        '  </div>'+
        '  <div class="kt-camp-card__body">'+
        '    <span class="kt-camp-card__addr">'+c.addr+'</span>'+
        '    <h3 class="kt-camp-card__name">'+c.name+'</h3>'+
        '    <div class="kt-camp-card__meta">'+
        '      <span class="kt-camp-card__meta-item">'+c.dates+' <span class="kt-camp-card__meta-icon"><svg><use href="#kt-i-cal"/></svg></span></span>'+
        '      <span class="kt-camp-card__meta-item">'+c.days+' <span class="kt-camp-card__meta-icon"><svg><use href="#kt-i-cal"/></svg></span></span>'+
        '      <span class="kt-camp-card__meta-item">'+c.hours+' <span class="kt-camp-card__meta-icon"><svg><use href="#kt-i-clock"/></svg></span></span>'+
        '      <span class="kt-camp-card__meta-item">גילאי '+c.ages+' <span class="kt-camp-card__meta-icon"><svg><use href="#kt-i-user"/></svg></span></span>'+
        '    </div>'+
        '    <div class="kt-camp-card__tags">'+ c.tags.map(function(t){ return '<span class="kt-camp-card__tag">'+t+'</span>'; }).join('') +'</div>'+
        '  </div>'+
        '  <div class="kt-camp-card__img">'+
        '    <img src="'+c.img+'" alt="" loading="lazy">'+
             badgeHtml +
        '  </div>'+
        '</a>';
    }).join('');
  }
  renderList();

  // Filter chips
  document.querySelectorAll('.kt-chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      document.querySelectorAll('.kt-chip').forEach(function(c){ c.classList.remove('kt-chip--active'); });
      chip.classList.add('kt-chip--active');
      currentFilter = chip.dataset.filter;
      renderList();
    });
  });
  document.getElementById('kt-q').addEventListener('input', renderList);

  // Map
  var map = L.map('kt-map', { zoomControl: true }).setView([32.10, 34.81], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 18
  }).addTo(map);
  var markerIcon = L.divIcon({
    className: 'kt-marker',
    html: '<div class="kt-marker__pin"><span>⛺</span></div>',
    iconSize: [32, 40], iconAnchor: [16, 40]
  });
  CAMPS.forEach(function(c){
    var m = L.marker([c.lat, c.lng], { icon: markerIcon }).addTo(map);
    m.bindPopup(
      '<div class="kt-marker-popup">' +
        '<b>'+c.name+'</b>' +
        c.addr + '<br>' +
        '<span class="kt-marker-popup__price">₪'+c.price.toLocaleString('he-IL')+'</span><br>' +
        '<a href="04-camp-page.html?camp='+c.id+'" style="color:#0a7d88;font-weight:700">פרטים →</a>' +
      '</div>'
    );
  });
</script>
</body>
</html>
