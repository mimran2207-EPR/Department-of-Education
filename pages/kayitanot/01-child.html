<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פרטי הילד/ה | רישום לקייטנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/kayitanot.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="kt-i-baby" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 8c-4 0-7 2.5-7 6v6h14v-6c0-3.5-3-6-7-6zm-2 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm4 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></symbol>
  <symbol id="kt-i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm9 14H6V10h12z"/></symbol>
  <symbol id="kt-i-chev" viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
  <symbol id="kt-i-arr-l" viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
  <symbol id="kt-i-check" viewBox="0 0 24 24"><path fill="currentColor" d="m9 16.17-3.88-3.88L3.71 13.7 9 19l11-11-1.41-1.42z"/></symbol>
</svg>

<main class="kt-page">
<div class="kt-split">

  <section class="kt-form-panel">
    <div class="kt-form-inner">

      <header class="kt-header">
        <h1 class="kt-header__title">רישום לקייטנות</h1>
        <span class="kt-header__tag">שנת הלימודים תשפ"ה</span>
      </header>

      <div class="kt-progress" aria-label="התקדמות: שלב 1 מתוך 4">
        <span class="kt-step kt-step--current">
          <span class="kt-step__label">פרטי הילד/ה</span>
          <span class="kt-step__circle">1</span>
        </span>
        <span class="kt-step__connector"></span>
        <span class="kt-step"><span class="kt-step__circle">2</span></span>
        <span class="kt-step__connector"></span>
        <span class="kt-step"><span class="kt-step__circle">3</span></span>
        <span class="kt-step__connector"></span>
        <span class="kt-step"><span class="kt-step__circle">4</span></span>
      </div>

      <div class="kt-section-h">
        <div class="kt-section-h__icon"><svg><use href="#kt-i-baby"/></svg></div>
        <div>
          <h2 class="kt-section-h__title">פרטי הילד/ה</h2>
          <p class="kt-section-h__sub">שדות נעולים נמשכים אוטומטית ממשרד הפנים ואינם ניתנים לעריכה.</p>
        </div>
      </div>

      <div class="kt-grid">
        <div class="kt-field">
          <label class="kt-field__label">שם הילד/ה</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value" id="kt-child-name">ניתאי כהן שלמה</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">מספר תעודת זהות</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value" id="kt-child-id">312456789</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">מגדר</label>
          <div class="kt-twoopt" id="kt-gender">
            <button type="button" class="kt-twoopt__btn">בת</button>
            <button type="button" class="kt-twoopt__btn kt-twoopt__btn--active">בן</button>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">תאריך לידה</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value" id="kt-child-bday">15/03/2020</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">מוסד</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value" id="kt-child-school">סביון ישע - ממ"ד</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">כיתה</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value" id="kt-child-class">ב'</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">יישוב</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value">ישע</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">רחוב</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value">ישע</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">מספר בית</label>
          <div class="kt-input kt-input--locked">
            <span class="kt-input__value">251</span>
            <svg class="kt-input__lock" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>
      </div>

      <div class="kt-actions">
        <a href="02-parents.html" class="kt-btn kt-btn--primary">
          המשך לשלב הבא
          <svg width="18" height="18"><use href="#kt-i-arr-l"/></svg>
        </a>
      </div>
    </div>
  </section>

  <aside class="kt-illustration" aria-hidden="true">
    <div class="kt-illustration__logo">
      <img src="../../assets/img/illustrations/muni-logo.svg" alt="muni">
    </div>
    <div class="kt-illustration__art">
      <img src="../../assets/img/kayitanot/art-child.png" alt="">
    </div>
  </aside>

</div>
</main>

<script>
  // Load kid from query param / sessionStorage
  var KIDS = {
    elaad: { name:'אלעד כהן שלמה',  id:'612789012', birth:'08/11/2024', gender:'male',   school:'גן פרח השדה',         class:'גן חובה' },
    yuval: { name:'יובל כהן שלמה',  id:'412567890', birth:'12/06/2022', gender:'male',   school:'גן עינב',              class:'גן' },
    noa:   { name:'נועה כהן שלמה',  id:'512678901', birth:'22/03/2018', gender:'female', school:'יסודי הירדן',          class:'ג\'' },
    nital: { name:'ניתאי כהן שלמה', id:'312456789', birth:'15/03/2020', gender:'male',   school:'סביון ישע - ממ"ד',     class:'ב\'' },
    shira: { name:'שירה כהן שלמה',  id:'712345670', birth:'04/02/2020', gender:'female', school:'גן רימון',              class:'גן חובה' },
    omer:  { name:'עומר כהן שלמה',  id:'812345671', birth:'10/05/2013', gender:'male',   school:'חט"ב הרצוג',           class:'ז\'' }
  };
  (function(){
    var p = new URLSearchParams(location.search);
    var key = p.get('kid');
    var kid = null;
    if (key && KIDS[key]) {
      kid = KIDS[key];
      sessionStorage.setItem('ktKid', JSON.stringify(kid));
      sessionStorage.setItem('ktKidKey', key);
    } else {
      try { kid = JSON.parse(sessionStorage.getItem('ktKid') || 'null'); } catch(_){}
    }
    if (!kid) return;
    var byId = function(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; };
    byId('kt-child-name',   kid.name);
    byId('kt-child-id',     kid.id);
    byId('kt-child-bday',   kid.birth);
    byId('kt-child-school', kid.school);
    byId('kt-child-class',  kid.class);
    var btns = document.querySelectorAll('#kt-gender .kt-twoopt__btn');
    btns.forEach(function(b){ b.classList.remove('kt-twoopt__btn--active'); });
    if (kid.gender === 'female') btns[0].classList.add('kt-twoopt__btn--active');
    else btns[1].classList.add('kt-twoopt__btn--active');
  })();

  document.querySelectorAll('.kt-twoopt').forEach(function(g){
    g.querySelectorAll('.kt-twoopt__btn').forEach(function(b){
      b.addEventListener('click', function(){
        g.querySelectorAll('.kt-twoopt__btn').forEach(function(s){ s.classList.remove('kt-twoopt__btn--active'); });
        b.classList.add('kt-twoopt__btn--active');
      });
    });
  });
</script>
</body>
</html>
