<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פרטי הילד/ה | רישום לקייטנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/kayitanot.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="kt-i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></symbol>
  <symbol id="kt-i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm9 14H6V10h12z"/></symbol>
  <symbol id="kt-i-cal" viewBox="0 0 24 24"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14z"/></symbol>
  <symbol id="kt-i-chev" viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
  <symbol id="kt-i-arr-l" viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
</svg>

<main class="kt-page">
<div class="kt-split">

  <section class="kt-form-panel">
    <div class="kt-form-inner">

      <header class="kt-header">
        <h1 class="kt-header__title">רישום לקייטנות</h1>
        <span class="kt-header__tag">שנת הלימודים תשפ"ה</span>
      </header>

      <div class="kt-progress" aria-label="התקדמות: שלב 1 מתוך 3">
        <div class="kt-progress__track"><div class="kt-progress__fill" style="width:33%"></div></div>
        <div class="kt-progress__steps">
          <span class="kt-step kt-step--current">
            <span>פרטי הילד/ה</span>
            <span class="kt-step__badge">1</span>
          </span>
          <span class="kt-step">2</span>
          <span class="kt-step">3</span>
        </div>
      </div>

      <div class="kt-section-h">
        <div class="kt-section-h__icon"><svg><use href="#kt-i-user"/></svg></div>
        <div>
          <h2 class="kt-section-h__title">פרטי הילד/ה</h2>
          <p class="kt-section-h__sub">שדות נעולים נמשכים אוטומטית ממשרד הפנים ואינם ניתנים לעריכה.</p>
        </div>
      </div>

      <form class="kt-grid" id="kt-form-child" onsubmit="event.preventDefault(); document.getElementById('kt-next').click();">
        <div class="kt-field">
          <label class="kt-field__label">שם הילד/ה</label>
          <div class="kt-input kt-input--locked" id="kt-child-name">
            <span>ניתאי כהן שלמה</span>
            <svg class="kt-input__icon" style="margin-inline-start:auto" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">מספר תעודת זהות</label>
          <div class="kt-input kt-input--locked" id="kt-child-id">
            <span>312456789</span>
            <svg class="kt-input__icon" style="margin-inline-start:auto" width="18" height="18"><use href="#kt-i-lock"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">תאריך לידה</label>
          <div class="kt-input kt-input--locked" id="kt-child-bday">
            <svg class="kt-input__icon" width="18" height="18"><use href="#kt-i-cal"/></svg>
            <span style="margin-inline-start:auto">15/03/2020</span>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">מגדר</label>
          <div class="kt-twoopt" id="kt-gender">
            <button type="button" class="kt-twoopt__btn">בת</button>
            <button type="button" class="kt-twoopt__btn kt-twoopt__btn--active">בן</button>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">קופת חולים</label>
          <div class="kt-input kt-input--select">
            <span>מכבי שירותי בריאות</span>
            <svg class="kt-input__chev" width="18" height="18"><use href="#kt-i-chev"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">לאום</label>
          <div class="kt-input kt-input--select">
            <span>יהודי</span>
            <svg class="kt-input__chev" width="18" height="18"><use href="#kt-i-chev"/></svg>
          </div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">יישוב</label>
          <div class="kt-input"><input class="kt-input__field" value="תל אביב יפו"></div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">רחוב</label>
          <div class="kt-input"><input class="kt-input__field" value="הרצל 40"></div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">מספר בית</label>
          <div class="kt-input"><input class="kt-input__field" inputmode="numeric" value="40"></div>
        </div>

        <div class="kt-field">
          <label class="kt-field__label">דירה</label>
          <div class="kt-input"><input class="kt-input__field" inputmode="numeric" value="25"></div>
        </div>

        <div class="kt-field kt-grid__full">
          <label class="kt-field__label">בעיות רפואיות / אלרגיות (אופציונלי)</label>
          <div class="kt-input" style="height:auto; padding:14px 16px;">
            <textarea class="kt-input__field" rows="2" placeholder="פרטו על אלרגיות, מחלות כרוניות, תרופות קבועות..." style="resize:vertical;min-height:60px"></textarea>
          </div>
        </div>
      </form>

      <div class="kt-actions">
        <span></span>
        <a href="02-parents.html" id="kt-next" class="kt-btn kt-btn--primary">
          המשך לשלב הבא
          <svg width="18" height="18"><use href="#kt-i-arr-l"/></svg>
        </a>
      </div>
    </div>
  </section>

  <aside class="kt-illustration" aria-hidden="true">
    <div class="kt-illustration__logo">
      <img src="../../assets/img/illustrations/muni-logo.svg" alt="muni">
    </div>
    <div class="kt-illustration__art" id="kt-art"></div>
  </aside>

</div>
</main>

<script src="../../assets/js/kayitanot-illustration.js"></script>
<script>
  // Render the camp illustration into #kt-art
  if (window.renderKayitanotArt) renderKayitanotArt(document.getElementById('kt-art'), 'child');

  // Load kid from query / sessionStorage
  var KIDS = {
    elaad: { name:'אלעד כהן שלמה',  id:'612789012', birth:'08/11/2024', gender:'male' },
    yuval: { name:'יובל כהן שלמה',  id:'412567890', birth:'12/06/2022', gender:'male' },
    noa:   { name:'נועה כהן שלמה',  id:'512678901', birth:'22/03/2018', gender:'female' },
    nital: { name:'ניתאי כהן שלמה', id:'312456789', birth:'18/09/2015', gender:'male' },
    shira: { name:'שירה כהן שלמה',  id:'712345670', birth:'04/02/2020', gender:'female' },
    omer:  { name:'עומר כהן שלמה',  id:'812345671', birth:'10/05/2013', gender:'male' }
  };
  (function(){
    var p = new URLSearchParams(location.search);
    var key = p.get('kid');
    var kid = null;
    if (key && KIDS[key]) {
      kid = KIDS[key];
      sessionStorage.setItem('ktKid', JSON.stringify(kid));
      sessionStorage.setItem('ktKidKey', key);
    } else {
      var s = sessionStorage.getItem('ktKid');
      if (s) try { kid = JSON.parse(s); } catch(_){}
    }
    if (!kid) return;
    document.querySelector('#kt-child-name span').textContent = kid.name;
    document.querySelector('#kt-child-id span').textContent = kid.id;
    var bd = document.querySelector('#kt-child-bday span'); if (bd) bd.textContent = kid.birth;
    var btns = document.querySelectorAll('#kt-gender .kt-twoopt__btn');
    btns.forEach(function(b){ b.classList.remove('kt-twoopt__btn--active'); });
    if (kid.gender === 'female') btns[0].classList.add('kt-twoopt__btn--active');
    else btns[1].classList.add('kt-twoopt__btn--active');
  })();

  // Toggle behavior
  document.querySelectorAll('.kt-twoopt').forEach(function(g){
    g.querySelectorAll('.kt-twoopt__btn').forEach(function(b){
      b.addEventListener('click', function(){
        g.querySelectorAll('.kt-twoopt__btn').forEach(function(s){ s.classList.remove('kt-twoopt__btn--active'); });
        b.classList.add('kt-twoopt__btn--active');
      });
    });
  });
</script>
</body>
</html>
