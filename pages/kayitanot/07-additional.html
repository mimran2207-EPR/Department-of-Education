<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רישום נוסף | רישום לקייטנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/kayitanot.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="kt-i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M3 11.5 12 4l9 7.5V21h-6v-6h-6v6H3z"/></symbol>
</svg>

<main class="kt-page">
<div class="kt-split">

  <section class="kt-form-panel" style="justify-content:center">
    <div class="kt-form-inner kt-additional">

      <h1 class="kt-additional__h">רישום ילד/ה נוסף</h1>
      <p class="kt-additional__sub">בחרו ילד/ה להמשיך עם הרישום לקייטנה.</p>

      <div class="kt-additional__kids" id="kt-kids"></div>

      <div style="text-align:center; margin-top:24px">
        <a href="../../index.html" class="kt-btn kt-btn--ghost">
          <svg width="18" height="18"><use href="#kt-i-home"/></svg>
          חזרה לפורטל חינוך
        </a>
      </div>

    </div>
  </section>

  <aside class="kt-illustration" aria-hidden="true">
    <div class="kt-illustration__logo">
      <img src="../../assets/img/illustrations/muni-logo.svg" alt="muni">
    </div>
    <div class="kt-illustration__art" id="kt-art"></div>
  </aside>

</div>
</main>

<script src="../../assets/js/kayitanot-illustration.js"></script>
<script>
  if (window.renderKayitanotArt) renderKayitanotArt(document.getElementById('kt-art'), 'additional');

  var ALL_KIDS = [
    { key:'elaad', name:'אלעד',  age:'1.5', img:'kid-elaad.png' },
    { key:'yuval', name:'יובל',  age:'4',   img:'kid-yuval.png' },
    { key:'noa',   name:'נועה',  age:'8',   img:'kid-noa.png' },
    { key:'nital', name:'ניתאי', age:'11',  img:'kid-nital.png' },
    { key:'shira', name:'שירה',  age:'6',   img:'kid-noa.png' },
    { key:'omer',  name:'עומר',  age:'13',  img:'kid-nital.png' }
  ];

  // Exclude the kid we just registered for
  var currentKey = sessionStorage.getItem('ktKidKey');
  var others = ALL_KIDS.filter(function(k){ return k.key !== currentKey; }).slice(0, 4);

  document.getElementById('kt-kids').innerHTML = others.map(function(k){
    return ''+
      '<a class="kt-kid-card" href="01-child.html?kid='+k.key+'" data-key="'+k.key+'">'+
      '  <div class="kt-kid-card__avatar"><img src="../../assets/img/illustrations/'+k.img+'" alt=""></div>'+
      '  <div class="kt-kid-card__name">'+k.name+'</div>'+
      '  <div class="kt-kid-card__age">'+k.age+' שנים</div>'+
      '</a>';
  }).join('');

  // Clear session before navigating to start a fresh kid flow
  document.querySelectorAll('.kt-kid-card').forEach(function(a){
    a.addEventListener('click', function(){
      try { sessionStorage.removeItem('ktKid'); sessionStorage.removeItem('ktKidKey'); sessionStorage.removeItem('ktCamp'); } catch(_){}
    });
  });
</script>
</body>
</html>
