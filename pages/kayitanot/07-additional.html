<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בחירת ילד/ה | רישום לקייטנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/kayitanot.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="kt-i-arr-l" viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></symbol>
</svg>

<!-- Background (blurred success layout, decorative only) -->
<main class="kt-page" aria-hidden="true" style="filter: blur(8px) opacity(0.5);">
  <div class="kt-split">
    <section class="kt-form-panel" style="display:flex; align-items:center;">
      <div class="kt-success-card">
        <div style="height:24px; background:var(--kt-border-soft); border-radius:6px; margin-bottom:14px;"></div>
        <div style="height:14px; background:var(--kt-border-soft); border-radius:6px; width:60%;"></div>
        <div style="height:80px; background:var(--kt-border-soft); border-radius:10px; margin-top:14px;"></div>
      </div>
    </section>
    <aside class="kt-illustration">
      <div class="kt-illustration__logo"><img src="../../assets/img/illustrations/muni-logo.svg" alt=""></div>
      <div class="kt-illustration__art"><img src="../../assets/img/kayitanot/art-success.png" alt=""></div>
    </aside>
  </div>
</main>

<!-- Picker modal -->
<div class="kt-modal-overlay">
  <div class="kt-modal" role="dialog" aria-modal="true" aria-labelledby="kt-modal-title">
    <h1 id="kt-modal-title" class="kt-modal__title">איזה ילד/ה תרצו<br>לרשום לקייטנה?</h1>
    <p class="kt-modal__sub">בחרו בילד/ה הרצוי</p>

    <div class="kt-modal__kids" id="kt-kids"></div>

    <a href="../../index.html" class="kt-btn kt-btn--outline" style="justify-content:center; width:100%;">
      חזרה לפורטל חינוך
    </a>
  </div>
</div>

<script>
  var ALL_KIDS = [
    { key:'elaad', name:'אלעד כהן שלמה',  gender:'male' },
    { key:'yuval', name:'יובל כהן שלמה',  gender:'male' },
    { key:'noa',   name:'נועה כהן שלמה',  gender:'female' },
    { key:'nital', name:'ניתאי כהן שלמה', gender:'male' },
    { key:'shira', name:'שירה כהן שלמה',  gender:'female' },
    { key:'omer',  name:'עומר כהן שלמה',  gender:'male' }
  ];
  var currentKey = sessionStorage.getItem('ktKidKey');
  var others = ALL_KIDS.filter(function(k){ return k.key !== currentKey; }).slice(0, 2);

  document.getElementById('kt-kids').innerHTML = others.map(function(k){
    var avatar = k.gender === 'female' ? 'avatar-girl.png' : 'avatar-boy.png';
    return ''+
      '<a class="kt-kid-card" href="01-child.html?kid='+k.key+'">'+
      '  <div class="kt-kid-card__avatar"><img src="../../assets/img/kayitanot/'+avatar+'" alt=""></div>'+
      '  <div class="kt-kid-card__name">'+k.name+'</div>'+
      '  <div class="kt-kid-card__cta"><svg width="14" height="14"><use href="#kt-i-arr-l"/></svg> הרשמה לקייטנה</div>'+
      '</a>';
  }).join('');

  document.querySelectorAll('.kt-kid-card').forEach(function(a){
    a.addEventListener('click', function(){
      try { sessionStorage.removeItem('ktKid'); sessionStorage.removeItem('ktKidKey'); sessionStorage.removeItem('ktCamp'); } catch(_){}
    });
  });
</script>
</body>
</html>
