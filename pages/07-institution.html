<script>
(function(){
  function closeAll(except){
    document.querySelectorAll('.dropdown-menu[data-open="true"]').forEach(function(menu){
      if (menu === except) return;
      menu.removeAttribute('data-open');
      var toggle = menu.parentElement.querySelector('[data-dropdown-toggle]');
      if (toggle) toggle.setAttribute('aria-expanded','false');
    });
  }

  document.querySelectorAll('[data-dropdown-toggle]').forEach(function(toggle){
    var wrap = toggle.closest('.dropdown-wrap');
    var menu = wrap.querySelector('.dropdown-menu');

    function toggleMenu(e){
      e.preventDefault();
      e.stopPropagation();
      var open = menu.getAttribute('data-open') === 'true';
      closeAll(menu);
      if (open) {
        menu.removeAttribute('data-open');
        toggle.setAttribute('aria-expanded','false');
      } else {
        menu.setAttribute('data-open','true');
        toggle.setAttribute('aria-expanded','true');
      }
    }

    toggle.addEventListener('click', toggleMenu);
    toggle.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') toggleMenu(e);
      if (e.key === 'Escape') { closeAll(null); }
    });

    menu.querySelectorAll('.dropdown-menu__item').forEach(function(item){
      item.addEventListener('click', function(e){
        e.stopPropagation();
        var value = item.getAttribute('data-value');
        var label = wrap.querySelector('.dropdown__value');
        if (label) label.textContent = value;
        toggle.style.color = 'var(--color-text-body)';
        closeAll(null);
      });
    });
  });

  document.addEventListener('click', function(){ closeAll(null); });
})();
</script>
